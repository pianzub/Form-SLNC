<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101923">
  <meta name="description" content="SLNC — Supplier & Logistics Non-Conformity">
  <title>SLNC</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232596BE'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-family='Arial' font-size='24' font-weight='700' fill='white'%3ESL%3C/text%3E%3C/svg%3E">
  <style>
    :root{color-scheme:light;--navy:#101923;--blue:#2596be;--muted:#7b8794;--bg:#f4f7f9}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .app-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg);opacity:0;transition:opacity .22s ease}
    .app-frame.ready{opacity:1}
    .loader-screen{position:fixed;z-index:2;inset:0;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#f4f7f9,#edf6f9);transition:opacity .2s ease,visibility .2s ease}
    .loader-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
    .loader-card{width:min(360px,100%);padding:28px 24px;border:1px solid #dfe6ea;border-radius:18px;background:#fff;text-align:center;box-shadow:0 16px 44px rgba(23,32,43,.1)}
    .brand{width:52px;height:52px;display:grid;place-items:center;margin:0 auto 14px;border-radius:15px;background:linear-gradient(145deg,var(--blue),#157397);color:#fff;font-size:16px;font-weight:800;box-shadow:0 9px 24px rgba(37,150,190,.25)}
    h1{margin:0;color:#17202b;font-size:22px;letter-spacing:-.4px}p{margin:7px 0 18px;color:var(--muted);font-size:12px;line-height:1.5}
    .progress{height:4px;overflow:hidden;border-radius:99px;background:#e8eef1}.progress span{display:block;width:42%;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),#65c7e5);animation:loading 1.1s ease-in-out infinite}
    .fallback{display:none;margin-top:17px;color:#52606d;font-size:11px}.fallback.show{display:block}.fallback a{display:inline-flex;margin-top:9px;padding:9px 13px;border-radius:9px;background:var(--blue);color:#fff;font-weight:700;text-decoration:none}
    @keyframes loading{0%{transform:translateX(-110%)}60%{transform:translateX(175%)}100%{transform:translateX(260%)}}
    @media(prefers-reduced-motion:reduce){.app-frame,.loader-screen{transition:none}.progress span{animation-duration:2s}}
  </style>
</head>
<body>
  <div class="loader-screen" id="loaderScreen">
    <div class="loader-card">
      <div class="brand">SL</div>
      <h1>SLNC</h1>
      <p>Memuat Supplier &amp; Logistics Non-Conformity…</p>
      <div class="progress" aria-label="Memuat aplikasi"><span></span></div>
      <div class="fallback" id="fallback">Aplikasi membutuhkan waktu lebih lama untuk dibuka.<br><a id="directLink" href="#">Buka Aplikasi Langsung</a></div>
    </div>
  </div>

  <iframe class="app-frame" id="appFrame" title="Aplikasi SLNC" allow="clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>

  <script>
    // Jika URL deployment Apps Script berubah, cukup ganti nilai APP_URL berikut.
    const APP_URL = 'https://script.google.com/macros/s/AKfycbx7vDOej4MsLu2nBcvYf5HdmmvdZjBlkIDVl5MtisOciyYna-LPDU_YTD2X-vKtzqU-/exec';
    const frame = document.getElementById('appFrame');
    const loader = document.getElementById('loaderScreen');
    const fallback = document.getElementById('fallback');
    const directLink = document.getElementById('directLink');

    directLink.href = APP_URL;
    frame.src = APP_URL;
    frame.addEventListener('load', function(){
      frame.classList.add('ready');
      window.setTimeout(function(){ loader.classList.add('hidden'); }, 180);
    });
    window.setTimeout(function(){
      if (!frame.classList.contains('ready')) fallback.classList.add('show');
    }, 9000);
  </script>
</body>
</html>
