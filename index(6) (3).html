<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#A80E13">
  <meta name="description" content="FnB Dasboard Analisis — Operations Dashboard">
  <meta property="og:title" content="FnB Dasboard Analisis">
  <meta property="og:description" content="Operations Dashboard">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://pianzub.github.io/Bakerzin-COGS-Dashboard/og.png">
  <title>FnB Dasboard Analisis</title>
  <style>
    :root { color-scheme: light; --brand:#a80e13; --brand-dark:#75080c; --ink:#18212d; --muted:#778493; --canvas:#f3f6f8; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { background:var(--canvas); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .shell { position:fixed; inset:0; width:100%; height:100%; background:var(--canvas); }
    .dashboard-frame { position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff; opacity:0; transition:opacity .28s ease; }
    .dashboard-frame.is-loaded { opacity:1; }
    .loader { position:absolute; inset:0; z-index:2; display:grid; place-content:center; justify-items:center; padding:28px; text-align:center; background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.98) 0,rgba(248,250,251,.96) 48%,rgba(235,241,244,.98) 100%); }
    .mark { display:grid; place-items:center; width:58px; height:58px; border-radius:17px; background:linear-gradient(145deg,var(--brand),var(--brand-dark)); color:#fff; font-size:18px; font-weight:850; letter-spacing:-.04em; box-shadow:0 14px 34px rgba(117,8,12,.22); }
    h1 { margin:17px 0 0; font-size:clamp(21px,3vw,29px); line-height:1.15; letter-spacing:-.035em; }
    .subtitle { margin:7px 0 0; color:var(--muted); font-size:13px; }
    .track { width:min(250px,70vw); height:4px; margin-top:24px; overflow:hidden; border-radius:99px; background:#dce4e9; }
    .track span { display:block; width:42%; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--brand),#dc4a41); animation:loading 1.15s ease-in-out infinite; }
    .slow { display:none; max-width:420px; margin-top:22px; padding:12px 15px; border:1px solid #dce4e8; border-radius:12px; background:rgba(255,255,255,.86); color:var(--muted); font-size:12px; line-height:1.55; box-shadow:0 10px 30px rgba(35,48,60,.06); }
    .slow.is-visible { display:block; }
    .slow p { margin:0 0 7px; }
    .slow a { color:var(--brand); font-weight:750; text-decoration:none; }
    .slow a:hover,.slow a:focus-visible { text-decoration:underline; }
    @keyframes loading { 0%{transform:translateX(-110%)} 55%{transform:translateX(105%)} 100%{transform:translateX(255%)} }
    @media (prefers-reduced-motion:reduce) { .dashboard-frame{transition:none} .track span{animation-duration:2.4s} }
  </style>
</head>
<body>
  <main class="shell">
    <iframe
      id="dashboardFrame"
      class="dashboard-frame"
      title="FnB Dasboard Analisis"
      src="https://script.google.com/macros/s/AKfycbw3DyK06en6MF9g8QtSEWVl-y7NU3BQWuqI64V-YMKBmtr0-YJWJO3wSv5OOD1Hz39VxA/exec"
      allow="clipboard-read; clipboard-write; fullscreen"
      referrerpolicy="no-referrer"
    ></iframe>
    <section class="loader" id="loader" aria-live="polite">
      <div class="mark" aria-hidden="true">F&amp;B</div>
      <h1>FnB Dasboard Analisis</h1>
      <p class="subtitle">Operations Dashboard</p>
      <div class="track" aria-hidden="true"><span></span></div>
      <div class="slow" id="slowMessage">
        <p>Pemuatan lebih lama dari biasanya. Pastikan akun Google Anda memiliki akses.</p>
        <a href="https://script.google.com/macros/s/AKfycbw3DyK06en6MF9g8QtSEWVl-y7NU3BQWuqI64V-YMKBmtr0-YJWJO3wSv5OOD1Hz39VxA/exec" target="_blank" rel="noreferrer">Buka dashboard langsung</a>
      </div>
    </section>
  </main>
  <noscript>
    <p>JavaScript diperlukan. <a href="https://script.google.com/macros/s/AKfycbw3DyK06en6MF9g8QtSEWVl-y7NU3BQWuqI64V-YMKBmtr0-YJWJO3wSv5OOD1Hz39VxA/exec">Buka dashboard langsung</a>.</p>
  </noscript>
  <script>
    const frame = document.getElementById('dashboardFrame');
    const loader = document.getElementById('loader');
    const slowMessage = document.getElementById('slowMessage');
    const slowTimer = window.setTimeout(() => slowMessage.classList.add('is-visible'), 12000);
    frame.addEventListener('load', () => {
      window.clearTimeout(slowTimer);
      frame.classList.add('is-loaded');
      loader.remove();
    });
  </script>
</body>
</html>
